<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#1a56db',
        accent: '#6d28d9',
        bgsoft: '#f3f4f6'
      }
    }
  }
}
</script>

</head>

<body class="bg-bgsoft flex items-center justify-center h-screen">

<div class="bg-white border border-gray-200 rounded-xl shadow-md p-8 w-96">

    <h2 class="text-xl font-semibold mb-2">Forgot Password</h2>

    <p class="text-gray-500 mb-6 text-sm">
        Enter your college email to reset password
    </p>

    <form method="POST">

        <input type="email" name="email" placeholder="Email"
            class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">

        <button class="w-full bg-accent text-white py-3 rounded-lg hover:bg-violet-800">
            Reset Password
        </button>

    </form>

    <p class="text-center mt-4 text-sm">
        <a href="/login" class="text-primary hover:underline">Back to Login</a>
    </p>

</div>

</body>
</html>
