<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Event Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Styling for inputs to match your original design */
    input, textarea, select { color: #374151; }
    ::placeholder { color: #9ca3af; }
    select:invalid { color: #9ca3af; }
    select:valid { color: #111827; }
    input[type="datetime-local"] { color: #374151; }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10">

  <div class="bg-gray-200 p-8 rounded-2xl shadow-md w-full max-w-3xl">
    <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Create Event Booking</h1>

    <form id="eventForm" class="space-y-6">

      <div class="space-y-4">
          <input type="text" id="title" name="title" placeholder="Event Title" required
            class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white"/>

          <textarea id="description" name="description" placeholder="Description" rows="3" required
            class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white"></textarea>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="faculty_name" name="faculty_name" placeholder="Faculty Name" required
              class="p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white"/>
            
            <input type="tel" id="phone" name="phone" placeholder="Phone Number" required
              class="p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white"/>
          </div>

          <select id="event_type" name="event_type_id" required
            class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
            <option value="" disabled selected>Select Event Type...</option>
          </select>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Start Time</label>
                <input type="datetime-local" id="start_time" name="start_time" required
                class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white"/>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">End Time</label>
                <input type="datetime-local" id="end_time" name="end_time" required
                class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white"/>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <select id="club" name="club_id" required
                class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
                <option value="" disabled selected>Select Club...</option>
              </select>

              <select id="venue" name="venue_id" required
                class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
                <option value="" disabled selected>Select Venue...</option>
              </select>
          </div>
      </div>

      <div class="bg-gray-100 p-5 rounded-xl border border-gray-300">
        <label class="font-bold block mb-3 text-gray-800">Manage Venue Facilities</label>
        
        <div id="selectedFacilitiesBox" class="min-h-[100px] p-4 border-2 border-dashed border-gray-400 rounded-lg bg-white flex flex-wrap gap-2 mb-4 items-start content-start">
            <span class="text-gray-400 text-sm italic" id="emptyFacilitiesText">Please select a venue first.</span>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
            <select id="facilityDropdown" disabled class="flex-grow p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white disabled:bg-gray-200 disabled:cursor-not-allowed">
                <option value="" disabled selected>Waiting for venue...</option>
            </select>
            
            <input type="number" id="facilityQuantity" min="1" placeholder="Qty" disabled
                class="w-24 p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 text-center disabled:bg-gray-200 disabled:cursor-not-allowed">
            
            <button type="button" id="addFacilityBtn" disabled
                class="bg-gray-800 text-white px-6 py-3 rounded-lg hover:bg-gray-700 transition font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
                Add
            </button>
        </div>

        <input type="hidden" name="facilities_json" id="facilities_json" value="[]">
      </div>

      <div>
        <label class="font-bold block mb-2 text-gray-800">Upload Permission Letter</label>
        <input type="file" id="permission_file" name="permission_file" accept=".pdf, .jpg, .jpeg, .png" required
          class="w-full p-2 border border-gray-300 rounded-lg bg-white file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 text-white font-bold p-4 rounded-lg hover:bg-blue-700 transition duration-300 shadow-lg">
        Submit Event Booking
      </button>

    </form>
    
    <div id="statusMessage" class="mt-6 text-center text-lg hidden"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // --- 1. POPULATE STATIC DROPDOWNS ---
        async function fetchAndPopulate(url, selectElementId, defaultText) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                const selectElement = document.getElementById(selectElementId);
                
                selectElement.innerHTML = `<option value="" disabled selected>${defaultText}</option>`;
                data.forEach(item => {
                    const option = document.createElement("option");
                    option.value = item.id; 
                    option.textContent = item.name;
                    selectElement.appendChild(option);
                });
            } catch (error) {
                console.error(`Error fetching ${selectElementId}:`, error);
            }
        }

        // Fetch clubs, event types, and venues on page load
        fetchAndPopulate('/api/clubs', 'club', 'Select Club...');
        fetchAndPopulate('/api/event-types', 'event_type', 'Select Event Type...');
        fetchAndPopulate('/api/venues', 'venue', 'Select Venue...');


        // --- 2. DYNAMIC FACILITY MANAGER LOGIC ---
        let availableFacilities = []; 
        let selectedFacilitiesList = [];

        const venueSelect = document.getElementById('venue');
        const facilityDropdown = document.getElementById('facilityDropdown');
        const facilityQuantity = document.getElementById('facilityQuantity');
        const addFacilityBtn = document.getElementById('addFacilityBtn');
        const selectedBox = document.getElementById('selectedFacilitiesBox');
        const emptyText = document.getElementById('emptyFacilitiesText');
        const hiddenJsonInput = document.getElementById('facilities_json');

        // Fetch facilities when venue changes
        venueSelect.addEventListener('change', async function() {
            const venueId = this.value;
            if (!venueId) return;

            // Reset UI
            facilityDropdown.innerHTML = '<option value="" disabled selected>Loading facilities...</option>';
            selectedFacilitiesList = [];
            updateFacilitiesUI();

            try {
                const response = await fetch(`/api/facilities/${venueId}`);
                availableFacilities = await response.json();

                facilityDropdown.innerHTML = '<option value="" disabled selected>Select a facility...</option>';
                
                if (availableFacilities.length === 0) {
                    facilityDropdown.innerHTML = '<option value="" disabled selected>No facilities available here.</option>';
                    emptyText.textContent = "No facilities available for this venue.";
                    return;
                }

                emptyText.textContent = "No facilities added yet.";

                // Populate Dropdown
                availableFacilities.forEach(f => {
                    const option = document.createElement('option');
                    option.value = f.id;
                    option.textContent = `${f.name} (Max: ${f.max_quantity})`;
                    option.dataset.max = f.max_quantity;
                    option.dataset.name = f.name;
                    facilityDropdown.appendChild(option);
                });

                // Unlock controls
                facilityDropdown.disabled = false;
                facilityQuantity.disabled = false;
                addFacilityBtn.disabled = false;

            } catch (error) {
                console.error("Error fetching facilities:", error);
                facilityDropdown.innerHTML = '<option value="" disabled selected>Error loading facilities.</option>';
            }
        });

        // Update the max HTML attribute AND reset box to EMPTY when a new facility is chosen
        facilityDropdown.addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            if (!selectedOption || !selectedOption.value) return;

            // Explicitly tell the browser's up/down arrows the NEW limit
            const maxAllowed = selectedOption.dataset.max;
            facilityQuantity.setAttribute('max', maxAllowed);
            facilityQuantity.max = maxAllowed; 

            // Leave the box blank for the user to type
            facilityQuantity.value = ''; 
        });

        // The Quantity Listener (stops them from typing over the max limit)
        facilityQuantity.addEventListener('input', function() {
            const selectedOption = facilityDropdown.options[facilityDropdown.selectedIndex];
            if (!selectedOption || !selectedOption.value) return;

            const currentMax = parseInt(selectedOption.dataset.max) || 999;
            
            if (this.value === '') return; // Allow the box to be empty
            
            const currentValue = parseInt(this.value);

            if (currentValue > currentMax) {
                this.value = currentMax;
            } else if (currentValue < 1) {
                // If they type 0 or a negative, just empty the box so they can try again
                this.value = '';
            }
        });

        // Click "Add" to create a chip
        addFacilityBtn.addEventListener('click', function() {
            const selectedOption = facilityDropdown.options[facilityDropdown.selectedIndex];
            
            if (!selectedOption.value) {
                alert("Please select a facility first.");
                return;
            }

            const qty = parseInt(facilityQuantity.value);
            
            // New Safety Check: Make sure they actually typed a valid number
            if (isNaN(qty) || qty < 1) {
                alert("Please enter a valid quantity before adding.");
                return;
            }

            const id = selectedOption.value;
            const name = selectedOption.dataset.name;

            const existingIndex = selectedFacilitiesList.findIndex(f => f.id === id);
            if (existingIndex > -1) {
                alert("Facility already added! Remove it first if you want to change the quantity.");
                return;
            }

            selectedFacilitiesList.push({ id: id, name: name, quantity: qty });
            updateFacilitiesUI();

            // Reset inputs for next selection (leaving quantity blank)
            facilityDropdown.selectedIndex = 0;
            facilityQuantity.value = '';
        });

        // Draw the chips and update the hidden JSON input
        function updateFacilitiesUI() {
            hiddenJsonInput.value = JSON.stringify(selectedFacilitiesList);
            selectedBox.innerHTML = '';

            if (selectedFacilitiesList.length === 0) {
                selectedBox.appendChild(emptyText);
                emptyText.style.display = 'block';
                return;
            }

            selectedFacilitiesList.forEach((facility) => {
                const chip = document.createElement('div');
                chip.className = "flex items-center gap-2 bg-blue-100 text-blue-800 px-3 py-1.5 rounded-lg border border-blue-300 text-sm font-semibold shadow-sm";
                
                chip.innerHTML = `
                    <span>${facility.name}</span>
                    <span class="bg-blue-500 text-white px-2 py-0.5 rounded-md text-xs">${facility.quantity}</span>
                    <button type="button" class="text-blue-500 hover:text-red-600 font-bold ml-1 text-lg leading-none focus:outline-none" onclick="removeFacility('${facility.id}')">&times;</button>
                `;
                selectedBox.appendChild(chip);
            });
        }

        // Global function to remove a chip
        window.removeFacility = function(idToRemove) {
            selectedFacilitiesList = selectedFacilitiesList.filter(f => f.id !== idToRemove);
            updateFacilitiesUI();
        };


        // --- 3. FORM SUBMISSION LOGIC ---
        document.getElementById('eventForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const submitBtn = this.querySelector('button[type="submit"]');
            const statusMsg = document.getElementById('statusMessage');
            
            submitBtn.textContent = 'Uploading and Submitting...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-wait');
            statusMsg.classList.add('hidden');

            const formData = new FormData(this);

            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    body: formData 
                });

                const result = await response.json();

                if (response.ok) {
                    statusMsg.textContent = "✅ Event submitted successfully!";
                    statusMsg.className = "mt-6 text-center text-lg font-bold text-green-600 block";
                    
                    // Clear the form and reset custom UI elements
                    this.reset(); 
                    selectedFacilitiesList = [];
                    updateFacilitiesUI();
                    facilityDropdown.innerHTML = '<option value="" disabled selected>Waiting for venue...</option>';
                    facilityDropdown.disabled = true;
                    facilityQuantity.disabled = true;
                    facilityQuantity.value = '';
                    addFacilityBtn.disabled = true;
                    
                } else {
                    throw new Error(result.error || 'Failed to submit event');
                }
            } catch (error) {
                console.error('Submission error:', error);
                statusMsg.textContent = "❌ Error: " + error.message;
                statusMsg.className = "mt-6 text-center text-lg font-bold text-red-600 block";
            } finally {
                submitBtn.textContent = 'Submit Event Booking';
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-wait');
            }
        });
    });
  </script>
</body>
</html>
