<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Venue | Venue Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gray-50 p-4 relative">

    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100 w-full max-w-md">
        <h2 class="text-2xl font-semibold text-gray-800 text-center mb-6">Create New Venue</h2>

        <form id="venue-form" class="space-y-4">

            <div>
                <label class="block text-sm text-gray-600 mb-1">Location</label>
                <select id="location" required
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white transition-colors">
                    <option value="" disabled selected>Select Location...</option>
                    <option value="Admin Block">Admin Block</option>
                    <option value="Ramanujan Block">Ramanujan Block</option>
                    <option value="Abdul Kalam Block">Abdul Kalam Block</option>
                    <option value="CLC Block">CLC Block</option>
                    <option value="South Block">South Block</option>
                    <option value="North Block">North Block</option>
                    <option value="VB Block">VB Block</option>
                    <option value="Behind CLC">Behind CLC</option>
                    <option value="Amphi Theater">Amphi Theater</option>
                </select>
            </div>

            <div class="flex gap-4">
                <div class="w-1/2">
                    <label class="block text-sm text-gray-600 mb-1">Floor</label>
                    <select id="floor"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white transition-colors disabled:bg-gray-100 disabled:text-gray-400">
                        <option value="">N/A</option>
                        <option value="Ground Floor">Ground Floor</option>
                        <option value="Floor 1">Floor 1</option>
                        <option value="Floor 2">Floor 2</option>
                        <option value="Floor 3">Floor 3</option>
                    </select>
                </div>

                <div class="w-1/2">
                    <label class="block text-sm text-gray-600 mb-1">Room No.</label>
                    <input type="text" id="room-number" placeholder="e.g. 101"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed">
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-600 mb-1">Venue Name</label>
                <input type="text" id="venue-name" required placeholder="e.g. Innovation Hall"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors disabled:bg-gray-100 disabled:text-gray-600 disabled:cursor-not-allowed disabled:font-semibold">
            </div>

            <div class="flex gap-4">
                <div class="w-2/3">
                    <label class="block text-sm text-gray-600 mb-1">Venue Type</label>
                    <select id="venue-type" required
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="" disabled selected>Select type...</option>
                        <option value="seminar_hall">Seminar Hall</option>
                        <option value="classroom">Classroom</option>
                        <option value="lab">Lab</option>
                        <option value="auditorium">Auditorium</option>
                    </select>
                </div>

                <div class="w-1/3">
                    <label class="block text-sm text-gray-600 mb-1">Capacity</label>
                    <input type="number" id="capacity" required min="1" placeholder="e.g. 60"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-600 mb-1">Description</label>
                <textarea id="description" rows="2" required placeholder="Description of the venue..."
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>

            <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 mt-2">
                <label class="block text-sm font-semibold text-blue-800 mb-2">Add Facilities</label>

                <div class="flex gap-2">
                    <div class="flex-grow relative">
                        <input type="text" id="facility-search" list="common-facilities" placeholder="e.g. AC, Chair"
                            class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 text-sm">
                        <datalist id="common-facilities">
                            <option value="AC">
                            <option value="Projector">
                            <option value="Chair">
                            <option value="Desk">
                            <option value="Microphone">
                            <option value="Whiteboard">
                        </datalist>
                    </div>
                    <input type="number" id="facility-qty" value="1" placeholder="Nos" min="1"
                        class="w-20 p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 text-sm">
                    <button type="button" id="add-facility-btn"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 rounded transition duration-200 text-sm">
                        Add
                    </button>
                </div>
                <div id="facilities-tags" class="flex flex-wrap gap-2 mt-3 empty:hidden"></div>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 mt-4">
                Review & Create
            </button>
            <p id="status-message" class="text-center text-sm mt-4 font-medium hidden"></p>
        </form>
    </div>

    <div id="confirmation-modal"
        class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">

            <div class="bg-gray-50 border-b border-gray-100 px-6 py-4">
                <h3 class="text-lg font-bold text-gray-800">Confirm Venue Details</h3>
                <p class="text-xs text-gray-500 mt-1">Please review the details before creating.</p>
            </div>

            <div class="px-6 py-4">
                <div id="modal-details" class="space-y-3 text-sm text-gray-700">
                </div>
            </div>

            <div class="bg-gray-50 border-t border-gray-100 px-6 py-4 flex justify-end gap-3">
                <button type="button" id="cancel-btn"
                    class="px-5 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 font-semibold transition">
                    Cancel
                </button>
                <button type="button" id="confirm-btn"
                    class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold transition">
                    Confirm & Create
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. UI Logic: Dynamic Field Greying ---
        const locationSelect = document.getElementById('location');
        const floorSelect = document.getElementById('floor');
        const roomInput = document.getElementById('room-number');
        const nameInput = document.getElementById('venue-name');

        locationSelect.addEventListener('change', (e) => {
            const loc = e.target.value;
            floorSelect.disabled = false;
            roomInput.disabled = false;
            nameInput.disabled = false;

            if (nameInput.value === 'Amphi Theater') nameInput.value = '';

            if (loc === 'Amphi Theater') {
                floorSelect.disabled = true; floorSelect.value = '';
                roomInput.disabled = true; roomInput.value = '';
                nameInput.value = 'Amphi Theater'; nameInput.disabled = true;
            } else if (loc === 'Behind CLC') {
                floorSelect.disabled = true; floorSelect.value = '';
                roomInput.disabled = true; roomInput.value = '';
            }
        });

        // --- 2. UI Logic: Facilities Tags System ---
        let selectedFacilities = [];
        const searchInput = document.getElementById('facility-search');
        const qtyInput = document.getElementById('facility-qty');
        const addFacilityBtn = document.getElementById('add-facility-btn');
        const tagsContainer = document.getElementById('facilities-tags');

        addFacilityBtn.addEventListener('click', () => {
            const name = searchInput.value.trim();
            const qty = parseInt(qtyInput.value);

            if (name && qty > 0) {
                const existingIndex = selectedFacilities.findIndex(f => f.name.toLowerCase() === name.toLowerCase());
                if (existingIndex > -1) {
                    selectedFacilities[existingIndex].quantity = qty;
                } else {
                    selectedFacilities.push({ name: name, quantity: qty });
                }
                searchInput.value = '';
                qtyInput.value = '';
                renderFacilityTags();
            }
        });

        function removeFacility(index) {
            selectedFacilities.splice(index, 1);
            renderFacilityTags();
        }

        function renderFacilityTags() {
            tagsContainer.innerHTML = '';
            selectedFacilities.forEach((facility, index) => {
                const tag = document.createElement('span');
                tag.className = "bg-white border border-blue-200 text-blue-800 text-xs font-semibold px-2.5 py-1.5 rounded-md flex items-center shadow-sm";
                tag.innerHTML = `
                    ${facility.name} - ${facility.quantity}
                    <button type="button" onclick="removeFacility(${index})" class="text-blue-400 hover:text-red-500 ml-2 focus:outline-none">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;
                tagsContainer.appendChild(tag);
            });
        }

        // --- 3. Modal & API Submission Logic ---
        const venueForm = document.getElementById('venue-form');
        const statusMsg = document.getElementById('status-message');

        // Modal Elements
        const modal = document.getElementById('confirmation-modal');
        const modalDetails = document.getElementById('modal-details');
        const cancelBtn = document.getElementById('cancel-btn');
        const confirmBtn = document.getElementById('confirm-btn');

        let pendingPayload = null; // Stores data while modal is open

        // Form Submit -> Opens Modal instead of sending immediately
        venueForm.addEventListener('submit', (e) => {
            e.preventDefault();
            statusMsg.classList.add('hidden'); // hide any previous messages

            // Get the text value of the venue type dropdown for the user to read nicely
            const typeSelect = document.getElementById('venue-type');
            const typeText = typeSelect.options[typeSelect.selectedIndex].text;

            // Save payload to global variable for the confirm button to use
            pendingPayload = {
                venue_name: nameInput.value,
                venue_type: document.getElementById('venue-type').value,
                location: locationSelect.value,
                floor: floorSelect.value || null,
                room_number: roomInput.value || null,
                capacity: parseInt(document.getElementById('capacity').value),
                description: document.getElementById('description').value,
                facilities: selectedFacilities
            };

            // Format Facilities for the display text
            let facilityText = "None added";
            if (selectedFacilities.length > 0) {
                facilityText = selectedFacilities.map(f => `${f.name} (${f.quantity})`).join(', ');
            }

            // Populate the modal with the details
            modalDetails.innerHTML = `
                <div class="grid grid-cols-3 gap-2 border-b pb-2"><span class="font-semibold text-gray-500">Name:</span> <span class="col-span-2 font-bold">${pendingPayload.venue_name}</span></div>
                <div class="grid grid-cols-3 gap-2 border-b pb-2"><span class="font-semibold text-gray-500">Location:</span> <span class="col-span-2">${pendingPayload.location}</span></div>
                <div class="grid grid-cols-3 gap-2 border-b pb-2"><span class="font-semibold text-gray-500">Floor/Room:</span> <span class="col-span-2">${pendingPayload.floor || 'N/A'} | Room: ${pendingPayload.room_number || 'N/A'}</span></div>
                <div class="grid grid-cols-3 gap-2 border-b pb-2"><span class="font-semibold text-gray-500">Type:</span> <span class="col-span-2">${typeText}</span></div>
                <div class="grid grid-cols-3 gap-2 border-b pb-2"><span class="font-semibold text-gray-500">Capacity:</span> <span class="col-span-2">${pendingPayload.capacity} People</span></div>
                <div class="grid grid-cols-3 gap-2 border-b pb-2"><span class="font-semibold text-gray-500">Facilities:</span> <span class="col-span-2 text-blue-600">${facilityText}</span></div>
                <div class="flex flex-col gap-1 mt-2"><span class="font-semibold text-gray-500">Description:</span> <span class="text-gray-600 italic">"${pendingPayload.description}"</span></div>
            `;

            // Show the Modal
            modal.classList.remove('hidden');
        });

        // Cancel Button -> Closes Modal
        cancelBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
            pendingPayload = null; // wipe temporary data
        });

        // Confirm Button -> Sends the data to Python
        confirmBtn.addEventListener('click', async () => {
            if (!pendingPayload) return;

            // Change button to show loading state
            const originalBtnText = confirmBtn.innerText;
            confirmBtn.innerText = "Creating...";
            confirmBtn.disabled = true;
            confirmBtn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                const response = await fetch('/venues', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pendingPayload)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Success setup
                    modal.classList.add('hidden');
                    statusMsg.classList.remove('hidden', 'text-red-600');
                    statusMsg.classList.add('text-green-600');
                    statusMsg.textContent = "✅ Venue created successfully!";

                    // Reset everything
                    venueForm.reset();
                    floorSelect.disabled = false;
                    roomInput.disabled = false;
                    nameInput.disabled = false;
                    selectedFacilities = [];
                    renderFacilityTags();
                } else {
                    throw new Error(data.error?.message || "Server rejected the data.");
                }
            } catch (error) {
                // Error handling
                modal.classList.add('hidden');
                statusMsg.classList.remove('hidden', 'text-green-600');
                statusMsg.classList.add('text-red-600');
                statusMsg.textContent = "❌ " + error.message;
            } finally {
                // Restore confirm button back to normal
                confirmBtn.innerText = originalBtnText;
                confirmBtn.disabled = false;
                confirmBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                pendingPayload = null;
            }
        });
    </script>
</body>

</html>
