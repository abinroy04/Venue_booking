<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Venue Booking Portal</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 bg-slate-50">

    <div class="w-full max-w-md bg-white p-8 md:p-10 rounded-3xl border border-slate-100 shadow-xl shadow-slate-100/50 flex flex-col space-y-8">
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center text-white mx-auto shadow-md shadow-blue-500/20 mb-3">
                <!-- Academic Hat SVG -->
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                </svg>
            </div>
            <h3 class="text-2xl font-bold text-slate-900 tracking-tight">Create Account</h3>
            <p class="text-sm text-slate-400 font-medium">Join Saintgits Venue Booking System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}

                    <div class="
                        px-4 py-3 rounded-xl text-sm font-medium

                        {% if category == 'error' %}
                            bg-red-50 border border-red-200 text-red-700
                        {% elif category == 'success' %}
                            bg-green-50 border border-green-200 text-green-700
                        {% else %}
                            bg-blue-50 border border-blue-200 text-blue-700
                        {% endif %}
                    ">
                        {{ message }}
                    </div>

                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Signup Form -->
        <form method="POST" action="/signup" class="space-y-5">
            <!-- Full Name Input -->
            <div class="space-y-1.5">
                <label for="name" class="text-xs font-bold text-slate-500 uppercase tracking-wider block">Full Name</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input
                        id="name"
                        type="text"
                        name="name"
                        placeholder="John Doe"
                        required
                        class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition-all text-slate-800 placeholder-slate-400 font-medium text-sm"
                    >
                </div>
            </div>

            <!-- Email Input -->
            <div class="space-y-1.5">
                <label for="email" class="text-xs font-bold text-slate-500 uppercase tracking-wider block">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
                        </svg>
                    </div>
                    <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="john.doe@saintgits.org"
                        required
                        class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition-all text-slate-800 placeholder-slate-400 font-medium text-sm"
                    >
                </div>
            </div>

            <!-- Password Input -->
            <div class="space-y-1.5">
                <label for="password" class="text-xs font-bold text-slate-500 uppercase tracking-wider block">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Create a strong password"
                        required
                        class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition-all text-slate-800 placeholder-slate-400 font-medium text-sm"
                    >
                </div>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition-all hover:scale-[1.01] shadow-lg shadow-blue-500/20 active:scale-[0.99] text-sm mt-2"
            >
                Sign Up
            </button>
        </form>

        <!-- Redirect to login -->
        <div class="text-center pt-2">
            <span class="text-sm text-slate-400 font-medium">Already have an account?</span>
            <a href="/login" class="text-sm font-bold text-blue-600 hover:text-blue-700 ml-1 hover:underline">
                Login
            </a>
        </div>

        <!-- Footer info -->
        <div class="text-center text-xs text-slate-400 font-semibold uppercase tracking-widest pt-4 border-t border-slate-50">
            Saintgits Engineering
        </div>
    </div>

</body>
</html>
